<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f5">
  <title>Reviewer Lab</title>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/workspace.css">
  <script src="/case-copy.js" defer></script>
  <script src="/test-explanation.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="app-rail" aria-label="Навигация лаборатории">
    <a class="rail-brand" href="/" aria-label="Reviewer Lab — быстрый старт"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 19V5h6.5a4.5 4.5 0 0 1 0 9H6m6-1 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <nav class="rail-nav" aria-label="Разделы">
      <button class="nav-button active" type="button" data-view="runs" title="Эксперименты" aria-label="Эксперименты"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6m-5 0v6l-5.6 9.3A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.1-3.7L14 9V3M7 15h10"/></svg><span id="run-count" class="visually-hidden">—</span></button>
      <button class="nav-button" type="button" data-view="demo" title="Быстрый старт" aria-label="Быстрый старт"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4V8Z"/></svg></button>
      <button class="nav-button rail-launch" type="button" data-view="launch" title="Запустить эксперимент" aria-label="Запустить эксперимент"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </nav>
    <div class="rail-bottom">
      <div class="connection" title="Состояние подключения"><span class="status-dot" id="connection-dot" aria-hidden="true"></span><span id="connection-label" class="visually-hidden" aria-live="polite">Подключаемся…</span></div>
      <button class="nav-button presentation-button" type="button" id="present-button" aria-label="Режим лекции" aria-pressed="false" title="Режим лекции"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H4V4Zm8 12v5m-4 0h8M2 4h20"/></svg></button>
    </div>
  </aside>
  <div class="workspace">
    <span id="breadcrumb" hidden>Эксперименты</span>
    <main id="main" tabindex="-1"><div class="loading">Загружаем сохранённые эксперименты…</div></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="case-dialog" aria-labelledby="case-dialog-title" aria-describedby="case-dialog-description"><div class="case-dialog-top"><div><h2 id="case-dialog-title">Что проверяем?</h2><p id="case-dialog-description">Выберите задачу для ревьюера.</p></div><button class="icon-button" type="button" data-action="close-case-picker" aria-label="Закрыть выбор задачи"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="case-options"></div><p class="case-dialog-note">Выбор задачи ничего не запускает. Все примеры выполняются в ограниченной локальной среде.</p></dialog>
  <dialog id="trace-dialog" aria-labelledby="trace-title" aria-describedby="trace-description"><div class="dialog-top"><div class="dialog-heading"><h2 id="trace-title"></h2><p class="dialog-subtitle" id="trace-description">Запрос, ответ и события</p></div><button class="icon-button" type="button" id="close-trace" aria-label="Закрыть трассу"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="trace-body"></div></dialog>
</body>
</html>
