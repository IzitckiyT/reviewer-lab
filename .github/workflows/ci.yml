name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python run.py check
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.cjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build reviewer-lab
      - run: docker compose -f compose.yaml -f tests/compose.ci.yaml run --rm reviewer-lab python run.py check
      - name: Verify installed official CLI versions and supported flags without inference
        run: docker compose -f compose.yaml -f tests/compose.ci.yaml run --rm reviewer-lab python tests/docker_smoke.py cli
      - name: Start live UI with offline CLI mock and no Internet route
        run: |
          docker compose -f compose.yaml -f tests/compose.ci.yaml up -d reviewer-lab
          docker compose -f compose.yaml -f tests/compose.ci.yaml exec -T reviewer-lab cp tests/mock_codex.py /home/lab/ci-mock-codex
          docker compose -f compose.yaml -f tests/compose.ci.yaml exec -T reviewer-lab chmod 700 /home/lab/ci-mock-codex
          python3 tests/docker_smoke.py live
          docker compose -f compose.yaml -f tests/compose.ci.yaml exec -T reviewer-lab python -c 'import json,pathlib; calls=[json.loads(line) for line in (pathlib.Path.home()/"ci-mock-calls.jsonl").read_text().splitlines()]; assert len(calls)==4; assert [call["role"] for call in calls].count("attacker")==1; assert all(call["model"].startswith("ci-") for call in calls)'
      - name: Verify run evidence and CLI home survive container recreation
        run: |
          docker compose -f compose.yaml -f tests/compose.ci.yaml up -d --force-recreate reviewer-lab
          python3 tests/docker_smoke.py persistence
          docker compose -f compose.yaml -f tests/compose.ci.yaml exec -T reviewer-lab test -s /home/lab/ci-mock-calls.jsonl
          docker compose -f compose.yaml -f tests/compose.ci.yaml down
      - name: Smoke-test explicit read-only demo over the published port
        run: |
          docker compose --profile demo up --build -d demo
          python3 tests/docker_smoke.py demo
      - if: failure()
        run: docker compose --profile demo logs --no-color
      - if: always()
        run: docker compose --profile demo down --volumes
